<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>中日黃海戰爭</title>
<style>
/* ============================================================
   設計規則（嚴格執行）
   1. 禁 #000 與黑框：以 1~3% 微明度差做 4 層背景分層
   2. 輸入聚焦禁描邊，改以雙環陰影加深
   3. 暗色字重全降 40（700→660 / 600→560 / 500→460 / 400→360）
   4. 流式打字 blur(6px) 漸顯，120ms，字間錯開 30ms
   5. 圖示下移 0.125em 對齊
   6. 數字鎖 tabular-nums 防抖
   7. 摺疊用 Grid 0fr→1fr
   8. 正文開 text-wrap: pretty
   ============================================================ */
:root{
  /* 4 層微明度背景（明度差約 1~3%） */
  --bg-0:#07070c;   /* 最深：app 底 */
  --bg-1:#0b0b14;   /* 地圖區 */
  --bg-2:#10101c;   /* 面板 */
  --bg-3:#151524;   /* 抬起 / 輸入 */
  --bg-4:#1b1b30;   /* 最高層 */
  --line:#23233a;   /* 邊界（非黑） */
  --line-soft:#1a1a2c;

  --text:#dadaea;
  --text-dim:#8e8ea8;
  --text-faint:#5c5c78;

  --cn:#e2b454;   /* 北洋 — 金 */
  --jp:#d8564d;   /* 聯合艦隊 — 朱 */
  --accent:#6ea8ff;

  /* 字重全降 40 */
  --fw-body:360;
  --fw-mid:460;
  --fw-semi:560;
  --fw-bold:660;

  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg-0);
  color:var(--text);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Hiragino Sans TC",system-ui,sans-serif;
  font-weight:var(--fw-body);
  font-size:15px;
  line-height:1.55;
  text-wrap:pretty;          /* 規則 8 */
  -webkit-font-smoothing:antialiased;
  letter-spacing:.01em;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";} /* 規則 6 */

/* 規則 5：圖示下移 0.125em 對齊 */
.ic{display:inline-block;transform:translateY(0.125em);line-height:1}

/* 規則 4：流式打字 */
.typechar{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(.18em);
  animation:typer 120ms var(--ease-out) forwards;white-space:pre}
@keyframes typer{to{opacity:1;filter:blur(0);transform:translateY(0)}}

/* 規則 7：摺疊 Grid 0fr→1fr */
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows 280ms var(--ease-out)}
.collapse>.inner{overflow:hidden;min-height:0}
.collapse.open{grid-template-rows:1fr}

/* 規則 2：輸入聚焦雙環陰影，無描邊 */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]:focus{outline:none;box-shadow:0 0 0 2px rgba(110,168,255,.55),0 0 0 5px rgba(110,168,255,.16);border-radius:999px}

/* ---------- 版面 ---------- */
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;background:var(--bg-0)}

/* 頂欄 */
.topbar{
  display:flex;align-items:center;gap:16px;
  padding:10px 18px;background:var(--bg-1);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:34px;height:34px;flex:0 0 auto;border-radius:10px;
  background:linear-gradient(135deg,var(--bg-3),var(--bg-2));
  display:grid;place-items:center;border:1px solid var(--line)}
.brand h1{font-size:17px;font-weight:var(--fw-semi);margin:0;letter-spacing:.06em}
.brand .sub{font-size:11.5px;color:var(--text-dim);letter-spacing:.12em}
.topbar .spacer{flex:1}
.phase-tag{font-size:12px;color:var(--text-dim);padding:5px 12px;border-radius:999px;
  background:var(--bg-2);border:1px solid var(--line);white-space:nowrap}
.phase-tag b{color:var(--text);font-weight:var(--fw-mid)}

/* 主區 */
.stage{position:relative;overflow:hidden;background:radial-gradient(1200px 800px at 50% 30%,#0d0d18 0%,var(--bg-1) 55%,var(--bg-0) 100%)}
.map-wrap{position:absolute;inset:0;touch-action:none}
.map-svg{width:100%;height:100%;display:block}

/* 浮動控制：地圖縮放 */
.zoom-ctl{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:6}
.zbtn{width:44px;height:44px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:20px;color:var(--text);transition:transform 160ms var(--ease-out),background 160ms}
.zbtn:active{transform:scale(.94);background:var(--bg-3)}

/* 圖例 */
.legend{position:absolute;top:14px;left:14px;z-index:6;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px;font-size:11.5px;color:var(--text-dim);backdrop-filter:blur(6px);
  box-shadow:0 8px 30px rgba(0,0,0,.35)}
.legend .row{display:flex;align-items:center;gap:8px;margin:4px 0}
.legend .dot{width:12px;height:12px;border-radius:50%}
.legend .dot.cn{background:var(--cn)}
.legend .dot.jp{background:var(--jp)}
.legend .dot.x{background:var(--text-faint)}

/* 船艦標籤（點選後） */
.ship-label{position:absolute;transform:translate(-50%,0);pointer-events:none;z-index:8;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:left 120ms linear,top 120ms linear}
.ship-label .flag{width:26px;height:17px;border-radius:3px;border:1px solid var(--line);overflow:hidden;background:var(--bg-3)}
.ship-label .name{font-size:12px;font-weight:var(--fw-semi);color:var(--text);
  background:var(--bg-2);border:1px solid var(--line);padding:2px 8px;border-radius:7px;white-space:nowrap}

/* 船艦圖示脈衝（選中） */
.ship-hit{cursor:pointer}

/* 右側詳情面板 */
.detail{position:absolute;top:14px;right:74px;bottom:96px;width:300px;z-index:7;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);
  transform:translateX(20px);opacity:0;pointer-events:none;transition:transform 260ms var(--ease-out),opacity 260ms var(--ease-out)}
.detail.show{transform:translateX(0);opacity:1;pointer-events:auto}
.detail .dhead{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.detail .dhead .flag{width:28px;height:19px;border-radius:4px;overflow:hidden;border:1px solid var(--line);flex:0 0 auto}
.detail .dhead h3{margin:0;font-size:17px;font-weight:var(--fw-bold);letter-spacing:.05em}
.detail .dhead .cls{font-size:11px;color:var(--text-dim)}
.detail .dbody{overflow-y:auto;padding:6px 16px 16px}
.sec{border-bottom:1px solid var(--line-soft)}
.sec:last-child{border-bottom:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:11px 0;cursor:pointer;user-select:none}
.sec-h .t{font-size:12.5px;font-weight:var(--fw-semi);letter-spacing:.1em;color:var(--text-dim)}
.sec-h .chev{transition:transform 240ms var(--ease-out);color:var(--text-faint)}
.sec.open .chev{transform:rotate(90deg)}
.sec .collapse{padding-bottom:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:3px 0 10px;font-size:13px}
.kv .k{color:var(--text-dim)}
.kv .v{color:var(--text);font-weight:var(--fw-mid);text-align:right}
.kv .v.num{font-variant-numeric:tabular-nums}
.closex{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-dim)}
.closex:active{background:var(--bg-3)}

/* ---------- 底部時間軸 ---------- */
.tl{background:var(--bg-1);border-top:1px solid var(--line-soft);padding:10px 16px 12px;
  display:flex;flex-direction:column;gap:8px;z-index:9}
.tl-row1{display:flex;align-items:center;gap:12px}
.tl-btns{display:flex;gap:6px}
.tbtn{min-width:44px;height:44px;padding:0 12px;border-radius:11px;background:var(--bg-2);
  border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:13px;
  color:var(--text);transition:transform 140ms var(--ease-out),background 160ms,border-color 160ms}
.tbtn:active{transform:scale(.95)}
.tbtn.primary{background:var(--accent);color:#0a1020;border-color:transparent;font-weight:var(--fw-semi)}
.tbtn.active{border-color:var(--accent);color:var(--accent)}
.tbtn .ic{font-size:15px}
.timecode{font-size:13px;color:var(--text-dim);white-space:nowrap}
.timecode .cur{color:var(--text);font-weight:var(--fw-mid)}
.speedgroup{display:flex;gap:4px;margin-left:auto}
.speedgroup .tbtn{min-width:40px;padding:0 10px;height:40px;font-size:12px}

/* scrubber */
.scrub{position:relative;height:30px;display:flex;align-items:center}
.scrub .track{position:absolute;left:0;right:0;height:6px;border-radius:999px;background:var(--bg-3);overflow:hidden}
.scrub .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#9bc2ff);border-radius:999px;transition:width 90ms linear}
.scrub .phases{position:absolute;inset:0;pointer-events:none}
.scrub .phases i{position:absolute;top:50%;width:2px;height:10px;background:var(--line);transform:translate(-50%,-50%)}
.scrub input{position:absolute;inset:0;width:100%;height:30px;opacity:0;cursor:pointer;margin:0}
.scrub .knob{position:absolute;left:0;top:50%;width:16px;height:16px;border-radius:50%;
  background:var(--text);border:3px solid var(--accent);transform:translate(-50%,-50%);
  pointer-events:none;transition:left 90ms linear;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.phaselabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-faint);letter-spacing:.05em;padding:0 2px}

/* iPad 直式時面板改為底部彈出 */
@media (max-width:820px){
  .detail{right:10px;left:10px;bottom:96px;top:auto;width:auto;max-height:46vh}
  .legend{font-size:10.5px;padding:8px 10px}
  .brand h1{font-size:15px}
  .phase-tag{display:none}
}
</style>
</head>
<body>
<div class="app">
  <!-- 頂欄 -->
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span class="ic" style="font-size:18px">⚓</span></div>
      <div>
        <h1 id="title">甲午黃海海戰</h1>
        <div class="sub">1894 · 9 · 17　鴨綠江大東溝外黃海海域</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="phase-tag">當前階段　<b id="phaseName">—</b></div>
  </header>

  <!-- 主舞台：地圖 -->
  <main class="stage" id="stage">
    <div class="map-wrap" id="mapWrap">
      <svg class="map-svg" id="map" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="seaGrad" cx="50%" cy="40%" r="80%">
            <stop offset="0%" stop-color="#12152a"/>
            <stop offset="60%" stop-color="#0c0e1c"/>
            <stop offset="100%" stop-color="#080810"/>
          </radialGradient>
          <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
            <path d="M50 0H0V50" fill="none" stroke="#1a1d30" stroke-width="0.5"/>
          </pattern>
          <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <g id="viewport">
          <!-- 海 -->
          <rect x="0" y="0" width="1000" height="640" fill="url(#seaGrad)"/>
          <rect x="0" y="0" width="1000" height="640" fill="url(#grid)" opacity=".5"/>

          <!-- 陸地：依影片還原——盛京省在上、山東省在左下、朝鮮在右，黃海居中 -->
          <g id="land" fill="#0f1220" stroke="#2a2d44" stroke-width="1">
            <!-- 盛京省（遼東半島，上方；海岸線南抵大東溝一帶） -->
            <path d="M0,0 L720,0 L720,158 Q600,150 520,160 Q420,168 330,178 Q270,192 245,226 Q220,198 180,172 Q90,166 0,160 Z"/>
            <!-- 朝鮮（右側；西海岸約 x=800，小乳燕角在右下角） -->
            <path d="M720,0 L1000,0 L1000,640 L820,640 Q830,520 845,420 Q855,320 830,220 Q815,130 790,80 Q760,40 720,30 Z"/>
            <!-- 山東省（左下；威海衛、成山頭半島向東伸入海中） -->
            <path d="M0,640 L0,535 Q100,520 190,538 Q270,555 320,585 Q360,615 380,640 Z"/>
          </g>

          <!-- 區域名稱 -->
          <g id="labels" fill="#6f7390" font-size="13" font-weight="460" style="font-weight:460">
            <text x="430" y="40">盛京省</text>
            <text x="170" y="615">山東省</text>
            <text x="930" y="200">平安道</text>
            <text x="935" y="330">朝　鮮</text>
          </g>
          <g id="sealabels" fill="#454a66" font-size="12" letter-spacing="2">
            <text x="455" y="475">黃　海</text>
            <text x="620" y="235" font-size="11">黃海海道</text>
            <text x="185" y="115" font-size="11">渤海</text>
          </g>

          <!-- 都市 / 地名 / 島嶼 -->
          <g id="cities" fill="#9aa0bd" font-size="10">
            <circle cx="237" cy="214" r="2" fill="#c8cbe0"/><text x="210" y="200">旅順</text>
            <circle cx="252" cy="200" r="2" fill="#c8cbe0"/><text x="258" y="204">大連</text>
            <circle cx="316" cy="580" r="2" fill="#c8cbe0"/><text x="290" y="575">威海衛</text>
            <circle cx="355" cy="598" r="2" fill="#c8cbe0"/><text x="361" y="602">成山頭</text>
            <circle cx="205" cy="558" r="2" fill="#c8cbe0"/><text x="180" y="553">芝罘</text>
            <circle cx="150" cy="605" r="2" fill="#c8cbe0"/><text x="156" y="609">青島</text>
            <circle cx="695" cy="350" r="2" fill="#c8cbe0"/><text x="701" y="354">海洋島</text>
            <circle cx="790" cy="388" r="2" fill="#c8cbe0"/><text x="760" y="405">大鹿島</text>
            <circle cx="792" cy="402" r="1.5" fill="#c8cbe0"/>
            <circle cx="558" cy="150" r="2" fill="#c8cbe0"/><text x="530" y="138">大孤山</text>
            <circle cx="420" cy="150" r="2" fill="#c8cbe0"/><text x="395" y="138">莊河</text>
          </g>

          <!-- 大東溝登入地 + 鴨綠江 -->
          <g id="dadonggou">
            <path d="M520,90 Q524,125 518,158" fill="none" stroke="#2e3a5e" stroke-width="2" stroke-linecap="round"/>
            <text x="486" y="132" fill="#46507a" font-size="10">鴨綠江</text>
            <circle cx="520" cy="155" r="3" fill="#9ecfff"/>
            <text x="528" y="148" fill="#c8cbe0" font-size="10" font-weight="560" style="font-weight:560">大東溝</text>
            <text x="528" y="160" fill="#6f7390" font-size="8.5">（登陸地點）</text>
          </g>

          <!-- 日軍出發錨地：朝鮮小乳燕角 -->
          <g id="anchorage">
            <circle cx="842" cy="560" r="3" fill="#d8564d"/>
            <text x="780" y="585" fill="#d8564d" font-size="9.5" font-weight="460" style="font-weight:460">小乳燕角臨時錨地</text>
          </g>

          <!-- 方位標（右下） -->
          <g id="compass" transform="translate(932,556)">
            <circle r="26" fill="#10101c" stroke="#2a2d44"/>
            <path d="M0,-20 L5,0 L0,20 L-5,0 Z" fill="#6f7390"/>
            <path d="M0,-20 L5,0 L0,0 Z" fill="#d8564d"/>
            <text x="0" y="-30" text-anchor="middle" fill="#c8cbe0" font-size="10" font-weight="560" style="font-weight:560">N</text>
          </g>

          <!-- 海戰地標（海面中央主戰區） -->
          <g id="battlemk">
            <circle cx="500" cy="395" r="58" fill="none" stroke="#c45" stroke-width="1" stroke-dasharray="3 4" opacity=".4"/>
            <circle cx="500" cy="395" r="3" fill="#e2b454"/>
            <text x="512" y="388" fill="#c8cbe0" font-size="11" font-weight="560" style="font-weight:560">黃海海戰</text>
            <text x="512" y="402" fill="#6f7390" font-size="9.5">主戰區</text>
          </g>

          <!-- 艦隊初始標註 -->
          <g id="fleetTags" font-size="10.5" font-weight="460" style="font-weight:460">
            <text x="360" y="298" fill="#e2b454" id="tagCN" opacity=".85">北洋海軍主隊</text>
            <text x="545" y="552" fill="#d8564d" id="tagJP" opacity=".85">日本聯合艦隊</text>
          </g>

          <!-- 沉沒殘骸標記層 -->
          <g id="wrecks"></g>
          <!-- 船艦層 -->
          <g id="ships"></g>
          <!-- 常態船名標籤層（不隨船身旋轉，保持正立） -->
          <g id="shipNames"></g>
          <g id="fx"></g>
        </g>
      </svg>
    </div>

    <!-- 圖例 -->
    <div class="legend">
      <div class="row"><span class="dot cn"></span>北洋水師（清）</div>
      <div class="row"><span class="dot jp"></span>聯合艦隊（日）</div>
      <div class="row"><span class="dot x"></span>已沉沒</div>
    </div>

    <!-- 縮放控制 -->
    <div class="zoom-ctl">
      <button class="zbtn" id="zoomIn" title="放大">+</button>
      <button class="zbtn" id="zoomOut" title="縮小">−</button>
      <button class="zbtn" id="zoomReset" title="重置" style="font-size:14px">⊙</button>
    </div>

    <!-- 選中船艦的浮動標籤（船名 + 當代國旗） -->
    <div class="ship-label" id="shipLabel" style="display:none">
      <div class="flag" id="labelFlag"></div>
      <div class="name" id="labelName"></div>
    </div>

    <!-- 詳情面板 -->
    <aside class="detail" id="detail">
      <button class="closex" id="closeDetail">✕</button>
      <div class="dhead">
        <div class="flag" id="detailFlag"></div>
        <div>
          <h3 id="dName"></h3>
          <div class="cls" id="dCls"></div>
        </div>
      </div>
      <div class="dbody" id="dBody"></div>
    </aside>
  </main>

  <!-- 底部時間軸 -->
  <footer class="tl">
    <div class="tl-row1">
      <div class="tl-btns">
        <button class="tbtn" id="btnRev" title="倒退"><span class="ic">⏮</span><span>倒退</span></button>
        <button class="tbtn primary" id="btnPlay" title="播放"><span class="ic">▶</span><span id="playText">播放</span></button>
        <button class="tbtn" id="btnPause" title="暫停" style="display:none"><span class="ic">⏸</span><span>暫停</span></button>
      </div>
      <div class="timecode">
        <span class="cur num" id="curTime">00:00</span>
        <span> / </span>
        <span class="num" id="totTime">05:00</span>
      </div>
      <div class="speedgroup">
        <button class="tbtn" data-sp="1">1×</button>
        <button class="tbtn active" data-sp="2">2×</button>
        <button class="tbtn" data-sp="4">4×</button>
        <button class="tbtn" data-sp="8">8×</button>
      </div>
    </div>
    <div class="scrub" id="scrub">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="phases" id="phases"></div>
      <div class="knob" id="knob"></div>
      <input type="range" id="range" min="0" max="1000" value="0" step="1">
    </div>
    <div class="phaselabels" id="phaseLabels"></div>
  </footer>
</div>

<script>
/* ============================================================
   黃海海戰 demo — 資料與動畫
   ============================================================ */

// 當代旗幟（SVG 內嵌）：中華人民共和國五星旗、日本國日之丸
const FLAG_CN = `<svg viewBox="0 0 30 20" width="100%" height="100%"><rect width="30" height="20" fill="#de2910"/>
<g fill="#ffde00">

/* ---------- 繪製船艦：火力俯視圖 ---------- */
function makeShipIcon(s){
  const color = s.fleet==='cn' ? '#e2b454' : '#d8564d';
  const dark  = s.fleet==='cn' ? '#8a6a2e' : '#7a322c';
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','ship-hit');
  g.setAttribute('data-id', s.id);
  // 點擊熱區（較大）
  const hit = document.createElementNS('http://www.w3.org/2000/svg','rect');
  hit.setAttribute('x',-20); hit.setAttribute('y',-12); hit.setAttribute('width',40); hit.setAttribute('height',24);
  hit.setAttribute('rx',6); hit.setAttribute('fill','transparent'); hit.style.pointerEvents='all';
  g.appendChild(hit);
  // 船體（俯視）
  const hull = document.createElementNS('http://www.w3.org/2000/svg','rect');
  hull.setAttribute('x',-16); hull.setAttribute('y',-6); hull.setAttribute('width',32); hull.setAttribute('height',12);
  hull.setAttribute('rx',5); hull.setAttribute('fill',color); hull.setAttribute('stroke',dark); hull.setAttribute('stroke-width',1);
  g.appendChild(hull);
  // 甲板中線
  const deck = document.createElementNS('http://www.w3.org/2000/svg','rect');
  deck.setAttribute('x',-12); deck.setAttribute('y',-3); deck.setAttribute('width',24); deck.setAttribute('height',6);
  deck.setAttribute('fill',dark); deck.setAttribute('opacity',.55);
  g.appendChild(deck);
  // 艏（右側）箭頭
  const bow = document.createElementNS('http://www.w3.org/2000/svg','path');
  bow.setAttribute('d','M16,-5 L22,0 L16,5 Z'); bow.setAttribute('fill',dark);
  g.appendChild(bow);
  // 主砲塔（口徑越大圓越大）
  const mainR = s.battery.mainCal ? Math.max(2.4, Math.min(4.5, s.battery.mainCal/80)) : 0;
  const secR  = s.battery.secCal  ? Math.max(1.3, Math.min(2.6, s.battery.secCal/80)) : 0;
  const place = (count, r, yBand)=>{
    if(!count) return;
    for(let i=0;i<count;i++){
      const t = count===1?0.5 : i/(count-1);
      const cx = -11 + t*22;
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', yBand); c.setAttribute('r', r);
      c.setAttribute('fill','#0e1020'); c.setAttribute('stroke',dark); c.setAttribute('stroke-width',.5);
      g.appendChild(c);
    }
  };
  place(s.battery.main, mainR, -4.2);
  place(s.battery.main, mainR,  4.2);
  place(s.battery.sec,  secR,   0);
  // 艦橋/煙囪
  const br = document.createElementNS('http://www.w3.org/2000/svg','rect');
  br.setAttribute('x',-2); br.setAttribute('y',-2.5); br.setAttribute('width',4); br.setAttribute('height',5);
  br.setAttribute('fill',dark); br.setAttribute('rx',1);
  g.appendChild(br);
  // 選中暈環（預設隱藏）
  const halo = document.createElementNS('http://www.w3.org/2000/svg','circle');
  halo.setAttribute('r',17); halo.setAttribute('fill','none'); halo.setAttribute('stroke',color);
  halo.setAttribute('stroke-width',1.5); halo.setAttribute('opacity',0); halo.setAttribute('class','halo');
  g.appendChild(halo);
  return g;
}

const shipEls = {};
SHIPS.forEach(s=>{ const el=makeShipIcon(s); shipsG.appendChild(el); shipEls[s.id]=el; });

/* ---------- 位置插值（Catmull-Rom 樣條：航跡平滑、航向自然轉向） ---------- */
const SVGNS='http://www.w3.org/2000/svg';
// 對控制點 P0..P3、參數 t∈[0,1] 取樣（P = [t,x,y]）
function crAt(P, t){
  const t2=t*t, t3=t2*t;
  const x=0.5*((2*P[1][1])+(-P[0][1]+P[2][1])*t+(2*P[0][1]-5*P[1][1]+4*P[2][1]-P[3][1])*t2+(-P[0][1]+3*P[1][1]-3*P[2][1]+P[3][1])*t3);
  const y=0.5*((2*P[1][2])+(-P[0][2]+P[2][2])*t+(2*P[0][2]-5*P[1][2]+4*P[2][2]-P[3][2])*t2+(-P[0][2]+3*P[1][2]-3*P[2][2]+P[3][2])*t3);
  return [x,y];
}
function segIdx(tr,p){ let i=0; while(i<tr.length-1 && p>tr[i+1][0]) i++; return i; }
function sampleAt(tr,p){
  p=Math.max(0,Math.min(1,p));
  const i=segIdx(tr,p);
  const a=tr[i], b=tr[Math.min(i+1,tr.length-1)];
  const t=Math.max(0,Math.min(1,(p-a[0])/((b[0]-a[0])||1)));
  const P=[tr[Math.max(0,i-1)],a,b,tr[Math.min(tr.length-1,i+2)]];
  return crAt(P,t);
}
function posAt(s, p){
  const [x,y]=sampleAt(s.track,p);
  // 航向 = 曲線切線（向前微取樣），自然反映轉向
  const [x2,y2]=sampleAt(s.track, Math.min(1,p+0.0015));
  let hdg=Math.atan2(y2-y, x2-x)*180/Math.PI;
  if(!isFinite(hdg)) hdg=0;
  return {x,y,hdg};
}

/* ---------- 常態船名標籤（每艘船下方，不隨船身旋轉） ---------- */
const namesG = $('shipNames');
const nameEls = {};
SHIPS.forEach(s=>{
  const g=document.createElementNS(SVGNS,'g');
  const w = s.name.length*12 + 10;
  const rect=document.createElementNS(SVGNS,'rect');

  rect.setAttribute('rx',3); rect.setAttribute('fill','rgba(7,8,14,0.78)');
  rect.setAttribute('stroke', s.fleet==='cn'?'#5a4a22':'#5a2a26'); rect.setAttribute('stroke-width',0.6);

  txt.setAttribute('fill', s.fleet==='cn'?'#f0cf85':'#f0a39c');

  g.appendChild(rect); g.appendChild(txt); g.style.pointerEvents='none';

});

/* ---------- 沉沒淡出 & 砲火特效 ---------- */
const sunkSet = new Set();
const wreckEls = {};
let ramFired=false;
const ZHIYUAN=SHIPS.find(s=>s.id==='zhiyuan'), YOSHINO=SHIPS.find(s=>s.id==='yoshino');
function updateShips(p){
  const z = state.zoom || 1;
  const scl = 1/z;                  // 縮放時船艦保持固定螢幕尺寸，避免放大後圖示堆疊
  SHIPS.forEach(s=>{
    const el = shipEls[s.id];
    const sunk = s.sunkAt!=null && p>=s.sunkAt;
    const effP = sunk ? s.sunkAt : p;   // 沉沒後凍結在沉沒點，原地灰色顯示
    let op = 1;
    if(sunk){
      const k = Math.min(1, (p - s.sunkAt)/0.06);
      op = 1 - k*0.45;                 // 沉沒過渡後降至 0.55，不再消失
      if(!sunkSet.has(s.id) && k>=1){ sunkSet.add(s.id); spawnSunk(s); spawnWreck(s); }
    }
    const {x,y,hdg}=posAt(s, effP);
    el.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${scl.toFixed(4)}) rotate(${hdg.toFixed(1)})`);
    el.setAttribute('opacity', op.toFixed(3));
    el.style.filter = sunk ? 'grayscale(1) brightness(0.72)' : 'none';
    el.style.pointerEvents = 'auto';
    // 船名標籤：固定螢幕尺寸、貼於船下方；沉沒變灰、選中放大
    const nl=nameEls[s.id];
    const sel = state.selectedId===s.id;
    const lscl = ((sel?1.2:1)/z).toFixed(4);
    nl.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${lscl}) translate(0,18)`);
    nl.setAttribute('opacity', op.toFixed(3));
    const t = nl.querySelector('text'), r = nl.querySelector('rect');
    if(sunk){
      t.setAttribute('fill','#8a8d9e');
      r.setAttribute('stroke','#3a3d52'); r.setAttribute('fill','rgba(7,8,14,0.55)');
    } else {
      t.setAttribute('fill', s.fleet==='cn'?'#f0cf85':'#f0a39c');
      r.setAttribute('stroke', s.fleet==='cn'?'#5a4a22':'#5a2a26'); r.setAttribute('fill','rgba(7,8,14,0.78)');
    }
  });
  checkRam(p);
  updateLabel();
}

/* 致遠撞吉野：兩艦接近時迸發撞擊衝擊波 */
function spawnFlash(x,y,color){
  const c=document.createElementNS(SVGNS,'circle');
  c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',3);
  c.setAttribute('fill',color);c.setAttribute('opacity',.95);
  fxG.appendChild(c);
  c.animate([{r:3,opacity:.95},{r:26,opacity:0}],{duration:900,easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'});
  const ring=document.createElementNS(SVGNS,'circle');
  ring.setAttribute('cx',x);ring.setAttribute('cy',y);ring.setAttribute('r',6);
  ring.setAttribute('fill','none');ring.setAttribute('stroke',color);ring.setAttribute('stroke-width',2);ring.setAttribute('opacity',.9);
  fxG.appendChild(ring);
  ring.animate([{r:6,opacity:.9,strokeWidth:2},{r:42,opacity:0,strokeWidth:.4}],{duration:1100,easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'});
  setTimeout(()=>{c.remove();ring.remove();},1200);
}
function checkRam(p){
  if(ramFired) return;
  if(p>=0.68 && p<=0.74 && ZHIYUAN && YOSHINO){
    const a=posAt(ZHIYUAN,p), b=posAt(YOSHINO,p);
    if(Math.hypot(a.x-b.x,a.y-b.y) < 16){
      ramFired=true;
      spawnFlash((a.x+b.x)/2,(a.y+b.y)/2,'#ffd86b');
    }
  }
}

function spawnSunk(s){
  const {x,y}=posAt(s,s.sunkAt);
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',4);
  c.setAttribute('fill','none');c.setAttribute('stroke',s.fleet==='cn'?'#e2b454':'#d8564d');
  c.setAttribute('opacity',.7);
  fxG.appendChild(c);
  c.animate([{r:4,opacity:.7},{r:22,opacity:0}],{duration:1200,easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'});
  setTimeout(()=>c.remove(),1300);
}
/* 沉沒殘骸：原地常駐灰色標記，倒帶時移除 */
function spawnWreck(s){
  if(wreckEls[s.id]) return;
  const {x,y}=posAt(s,s.sunkAt);
  const g=document.createElementNS(SVGNS,'g');
  g.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)})`);
  g.setAttribute('opacity',0);
  const ring=document.createElementNS(SVGNS,'circle');
  ring.setAttribute('r',11); ring.setAttribute('fill','none');
  ring.setAttribute('stroke','#6a6d80'); ring.setAttribute('stroke-width',1.1);
  ring.setAttribute('stroke-dasharray','2 3');
  const dot=document.createElementNS(SVGNS,'circle');
  dot.setAttribute('r',1.8); dot.setAttribute('fill','#7a7d90');
  g.appendChild(ring); g.appendChild(dot);
  wrecksG.appendChild(g);
  wreckEls[s.id]=g;
  g.animate([{opacity:0},{opacity:.8}],{duration:700,fill:'forwards'});
}

/* ---------- 選擇船艦 ---------- */
function selectShip(id){
  state.selectedId = id;
  // halo
  Object.values(shipEls).forEach(el=> el.querySelector('.halo').setAttribute('opacity',0));
  if(id){ const h=shipEls[id].querySelector('.halo'); h.setAttribute('opacity',1); h.setAttribute('filter','url(#glow)'); }
  renderDetail(id);
  label.style.display = id ? 'flex':'none';
  updateLabel();
}

shipsG.addEventListener('click', e=>{
  const g = e.target.closest('.ship-hit');
  if(g) selectShip(g.getAttribute('data-id'));
});

function updateLabel(){
  if(!state.selectedId){ return; }
  const s = SHIPS.find(x=>x.id===state.selectedId);
  const {x,y}=posAt(s, state.progress);
  // 以 SVG 當前 CTM（含 viewBox 縮放平移）換算成畫面座標
  const pt = map.createSVGPoint(); pt.x=x; pt.y=y;
  const sp = pt.matrixTransform(map.getScreenCTM());
  label.style.left = sp.x + 'px';
  label.style.top  = (sp.y + 18) + 'px';
  labelName.textContent = s.name;
  labelFlag.innerHTML = s.fleet==='cn' ? FLAG_CN : FLAG_JP;
}

/* ---------- 詳情面板 ---------- */
function renderDetail(id){
  if(!id){ detail.classList.remove('show'); return; }
  const s = SHIPS.find(x=>x.id===id);
  dFlag.innerHTML = s.fleet==='cn'?FLAG_CN:FLAG_JP;
  dName.textContent = s.name;
  dCls.textContent = `${s.type} · ${s.role} · ${s.origin}`;
  const sections = [
    {t:'基本資料', open:true, rows:[
      ['所屬', s.fleet==='cn'?'北洋水師（清）':'聯合艦隊（日）'],
      ['分類', s.category], ['艦種', s.type], ['建造', s.origin], ['下水', s.year],
      ['狀態', s.sunkAt!=null?'已沉沒':'存續']
    ]},
    {t:'性能諸元', open:true, rows:[
      ['材質', s.material],
      ['排水量', s.disp],
      ['航速', s.speed],
      ['乘員', s.crew]
    ]},
    {t:'武裝（火力俯視）', open:true, rows:[
      ['主砲', `${s.battery.mainCal||'—'}mm × ${s.battery.main}`],
      ['副砲', `${s.battery.secCal||'—'}mm × ${s.battery.sec}`],
      ['武備', s.weapons]
    ]}
  ];
  dBody.innerHTML='';
  sections.forEach((sec,i)=>{
    const wrap=document.createElement('div'); wrap.className='sec'+(sec.open?' open':'');
    const h=document.createElement('div'); h.className='sec-h';
    h.innerHTML=`<span class="t">${sec.t}</span><span class="chev ic">›</span>`;
    const col=document.createElement('div'); col.className='collapse'+(sec.open?' open':'');
    const inner=document.createElement('div'); inner.className='inner';
    const kv=document.createElement('div'); kv.className='kv';
    sec.rows.forEach(r=>{
      kv.innerHTML += `<div class="k">${r[0]}</div><div class="v ${/[0-9]/.test(r[1])?'num':''}">${r[1]}</div>`;
    });
    inner.appendChild(kv); col.appendChild(inner); wrap.appendChild(h); wrap.appendChild(col);
    h.addEventListener('click',()=>{ wrap.classList.toggle('open'); col.classList.toggle('open'); });
    dBody.appendChild(wrap);
  });
  detail.classList.add('show');
  // 打字漸顯：面板數值
  typeIn(dBody, 30);
}
$('closeDetail').addEventListener('click',()=>selectShip(null));

/* 規則 4：流式打字 blur(6px) 漸顯 120ms、字間錯開 30ms */
function typeIn(container, stagger=30){
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
  const nodes=[]; let n;
  while(n=walker.nextNode()) nodes.push(n);
  nodes.forEach(tn=>{
    const text = tn.nodeValue;
    if(!text.trim()) return;
    const frag = document.createDocumentFragment();
    [...text].forEach((ch,i)=>{
      const s=document.createElement('span'); s.className='typechar';
      s.textContent=ch; s.style.animationDelay=(i*stagger)+'ms';
      frag.appendChild(s);
    });
    tn.parentNode.replaceChild(frag, tn);
  });
}

/* ---------- 時間軸 ---------- */
function fmt(t){ const m=Math.floor(t/60), s=Math.floor(t%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function phaseAt(p){ let name=PHASES[0].name; for(const ph of PHASES){ if(p>=ph.t) name=ph.name; } return name; }

function renderPhaseUI(){
  const ph=$('phases'), pl=$('phaseLabels');
  ph.innerHTML=''; pl.innerHTML='';
  PHASES.slice(0,-1).forEach(ph0=>{
    const i=document.createElement('i'); i.style.left=(ph0.t*100)+'%'; ph.appendChild(i);
  });
  PHASES.forEach(ph0=>{
    const sp=document.createElement('span'); sp.textContent=ph0.name; sp.style.width=(100/PHASES.length)+'%';
    sp.style.textAlign='center'; pl.appendChild(sp);
  });
}
renderPhaseUI();
$('totTime').textContent = fmt(DURATION);

/* 倒帶 / 重播時重新武裝沉沒與撞擊特效 */
const MIN_SUNK = Math.min(...SHIPS.map(s=>s.sunkAt??1));
function rearmEffects(p){
  // 逐艦清理：進度回拖到沉沒點之前時，移除殘骸標記並重置沉沒狀態
  SHIPS.forEach(s=>{
    if(s.sunkAt!=null && p < s.sunkAt){
      sunkSet.delete(s.id);
      if(wreckEls[s.id]){ wreckEls[s.id].remove(); delete wreckEls[s.id]; }
    }
  });
  if(p < 0.68) ramFired=false;
}
function applyProgress(){
  const p = state.progress;
  rearmEffects(p);
  updateShips(p);
  range.value = Math.round(p*1000);
  fill.style.width = (p*100)+'%';
  knob.style.left = (p*100)+'%';
  curTime.textContent = fmt(p*DURATION);
  phaseName.textContent = phaseAt(p);
}

range.addEventListener('input', ()=>{ state.progress = range.value/1000; applyProgress(); });
range.addEventListener('pointerdown', ()=>{ state.wasPlaying=state.playing; if(state.playing) togglePlay(); });
range.addEventListener('pointerup', ()=>{ if(state.wasPlaying) togglePlay(); });

/* 播放控制 */
function togglePlay(){
  state.playing = !state.playing;
  $('btnPlay').style.display = state.playing ? 'none':'inline-flex';
  $('btnPause').style.display = state.playing ? 'inline-flex':'none';
  if(state.playing) state.dir=1;
  $('btnRev').classList.toggle('active', state.dir===-1 && state.playing);
}
$('btnPlay').addEventListener('click', togglePlay);
$('btnPause').addEventListener('click', togglePlay);
$('btnRev').addEventListener('click', ()=>{
  state.dir=-1; state.playing=true;
  $('btnPlay').style.display='none'; $('btnPause').style.display='inline-flex';
  $('btnRev').classList.add('active');
});
document.querySelectorAll('.speedgroup .tbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.speedgroup .tbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.speed = +b.dataset.sp;
  });
});

/* rAF 主迴圈 */
let last=performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last=now;
  if(state.playing){
    state.progress += state.dir * dt * (state.speed) / DURATION;
    if(state.progress>=1){ state.progress=1; if(state.dir===1){ state.playing=false; $('btnPlay').style.display='inline-flex'; $('btnPause').style.display='none'; } }
    if(state.progress<=0){ state.progress=0; if(state.dir===-1){ state.playing=false; $('btnRev').classList.remove('active'); $('btnPlay').style.display='inline-flex'; $('btnPause').style.display='none'; } }
    applyProgress();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 地圖縮放 / 平移（觸控 + 滾輪 + 按鈕） ---------- */
function applyView(){
  const w=state.viewW, h=state.viewH;
  // 用 viewBox 實現縮放平移
  const vw = w/state.zoom, vh = h/state.zoom;
  const cx = w/2 - state.zx/state.zoom;
  const cy = h/2 - state.zy/state.zoom;
  map.setAttribute('viewBox', `${cx-vw/2} ${cy-vh/2} ${vw} ${vh}`);
  updateShips(state.progress);   // 縮放/平移時即時刷新船艦（暫停中也生效）
  updateLabel();
}
let pinch=null, dragging=false, dragStart=null;
const wrap=$('mapWrap');
wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = e.deltaY<0 ? 1.15 : 1/1.15;
  state.zoom = Math.min(5, Math.max(1, state.zoom*f));
  applyView();
},{passive:false});
wrap.addEventListener('pointerdown', e=>{
  if(e.target.closest('.ship-hit')) return; // 點船不拖
  if(e.pointerType==='touch' && e.isPrimary===false){ pinch={d1:null}; }
  dragging=true; dragStart={x:e.clientX,y:e.clientY,zx:state.zx,zy:state.zy};
  wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener('pointermove', e=>{
  if(!dragging) return;
  // 多點：計算兩指距離縮放
  // 簡化：單指平移
  state.zx = dragStart.zx + (e.clientX-dragStart.x);
  state.zy = dragStart.zy + (e.clientY-dragStart.y);
  applyView();
});
wrap.addEventListener('pointerup', e=>{ dragging=false; try{wrap.releasePointerCapture(e.pointerId);}catch(_){} });
$('zoomIn').onclick=()=>{ state.zoom=Math.min(5,state.zoom*1.3); applyView(); };
$('zoomOut').onclick=()=>{ state.zoom=Math.max(1,state.zoom/1.3); applyView(); };
$('zoomReset').onclick=()=>{ state.zoom=1; state.zx=0; state.zy=0; applyView(); };

/* 雙指縮放（觸控） */
const touches={};
wrap.addEventListener('touchstart', e=>{
  for(const t of e.changedTouches) touches[t.identifier]=t;
  if(Object.keys(touches).length===2){ dragging=false; }
},{passive:true});
wrap.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches) touches[t.identifier]=t;
  const ids=Object.keys(touches);
  if(ids.length===2){
    const [a,b]=[touches[ids[0]],touches[ids[1]]];
    const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pinch && pinch.d){ const f=dist/pinch.d; state.zoom=Math.min(5,Math.max(1,state.zoom*f)); applyView(); }
    pinch={d:dist};
    e.preventDefault();
  }
},{passive:false});
wrap.addEventListener('touchend', e=>{
  for(const t of e.changedTouches) delete touches[t.identifier];
  if(Object.keys(touches).length<2) pinch=null;
});

/* ---------- 開場打字 ---------- */
typeIn($('title'), 30);
/* 初始渲染 */
applyProgress();
/* 開場自動播放（demo 效果） */
togglePlay();
/* 縮放視窗時更新 label */
window.addEventListener('resize', ()=>{ updateLabel(); });
</script>
